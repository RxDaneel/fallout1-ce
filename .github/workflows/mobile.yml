# Compila la versione con i controlli mobile (controller + tocco diretto)
# per iPhone (.ipa da firmare con Sideloadly) e Android (.apk).
# Parte a ogni push sul ramo controlli-mobile, oppure a mano da Actions.
name: Mobile

on:
  push:
    branches:
      - controlli-mobile
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Build
        run: |
          cd os/android
          ./gradlew assembleRelease

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-android-controlli
          path: os/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  ios:
    name: iOS
    runs-on: macos-14
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -B build -D CMAKE_BUILD_TYPE=RelWithDebInfo -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/ios.toolchain.cmake -D ENABLE_BITCODE=0 -D PLATFORM=OS64 -G Xcode -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""
          cmake --build build --config RelWithDebInfo -j $(sysctl -n hw.physicalcpu)
          cd build
          cpack -C RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-ios-controlli
          path: build/fallout-ce.ipa
          retention-days: 30
